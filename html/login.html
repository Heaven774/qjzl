<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辣椒产业数据管理平台 - 登录</title>
    <link rel="stylesheet" href="qjzl/css/floating-panel.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: var(--primary);
            border-radius: 50%;
            animation: particleFloat 20s infinite;
            opacity: 0.5;
        }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        .login-wrapper {
            width: 100%;
            max-width: 520px;
            padding: 20px;
            z-index: 10;
            animation: slideUp 0.6s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-icon {
            font-size: 4.5rem;
            margin-bottom: 22px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        .login-title {
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .login-subtitle {
            font-size: 0.95rem;
            color: var(--text-dim);
            font-weight: 300;
            letter-spacing: 1px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .form-group label {
            font-size: 0.82rem;
            margin-bottom: 8px;
            color: var(--text-dim);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .status-message {
            text-align: center;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-top: 16px;
            font-size: 0.9rem;
            display: none;
            border: 1px solid transparent;
        }

        .status-message.error {
            background: var(--danger-dim);
            color: #ff6b81;
            border-color: rgba(255, 42, 109, 0.2);
            display: block;
        }

        .status-message.success {
            background: var(--success-dim);
            color: var(--success);
            border-color: rgba(0, 255, 157, 0.2);
            display: block;
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .footer-link a {
            color: var(--primary);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer-link a:hover { opacity: 0.7; }

        @media (max-width: 500px) {
            .login-wrapper { padding: 16px; }
            .login-title { font-size: 1.5rem; }
            .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div id="particles"></div>

    <div class="login-wrapper">
        <div class="floating-panel" style="padding: 44px 40px;">
            <div class="login-header">
                <div class="login-icon">🌶️</div>
                <h1 class="login-title">辣椒产业数据管理平台</h1>
                <p class="login-subtitle">请登录平台以开始监控</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="account">账号</label>
                        <input type="text" class="input-field" id="account" placeholder="请输入账号" required>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" class="input-field" id="password" placeholder="请输入密码" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="deviceID">主设备ID</label>
                        <input type="text" class="input-field" id="deviceID" placeholder="请输入主设备ID" required>
                    </div>
                    <div class="form-group">
                        <label for="coldChainDeviceID">冷链设备ID</label>
                        <input type="text" class="input-field" id="coldChainDeviceID" placeholder="冷链设备ID（可选）">
                    </div>
                </div>

                <button type="submit" class="btn-gradient" id="loginBtn" style="width:100%;padding:16px;font-size:1.05rem;margin-top:10px;">
                    <span>登录系统</span>
                </button>
            </form>
            <div class="status-message" id="statusMessage"></div>
        </div>
    </div>

    <script src="qjzl/js/jquery.min.js"></script>
    <script src="qjzl/js/nlecloud-sdk.js"></script>
    <script>
        let api;
        const API_BASE = `/api`;

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 40; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 15) + 's';
                container.appendChild(particle);
            }
        }

        function showStatus(message, type) {
            const statusElement = document.getElementById('statusMessage');
            statusElement.textContent = message;
            statusElement.className = `status-message ${type}`;
        }

        function hideStatus() {
            const statusElement = document.getElementById('statusMessage');
            statusElement.style.display = 'none';
        }

        async function recordLoginLog(username, status, failureReason = '') {
            try {
                const response = await fetch(`${API_BASE}/login/log`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: null,
                        username: username,
                        user_agent: navigator.userAgent,
                        status: status,
                        failure_reason: failureReason,
                        session_id: sessionStorage.getItem('sessionId') || null
                    })
                });
                const result = await response.json();
                console.log('登录日志记录:', result);
            } catch (error) {
                console.error('记录登录日志失败:', error);
            }
        }

        async function handleLogin(event) {
            event.preventDefault();

            const account = document.getElementById('account').value.trim();
            const password = document.getElementById('password').value.trim();
            const deviceID = document.getElementById('deviceID').value.trim();
            const coldChainDeviceID = document.getElementById('coldChainDeviceID').value.trim();
            const loginBtn = document.getElementById('loginBtn');

            if (!account || !password || !deviceID) {
                showStatus('请填写所有必填字段', 'error');
                recordLoginLog(account, 'failed', '缺少必填字段');
                return;
            }

            loginBtn.innerHTML = '<span class="loading-spinner"></span><span>登录中...</span>';
            loginBtn.disabled = true;
            hideStatus();

            try {
                api = new NLECloudAPI();
            } catch (error) {
                showStatus('API初始化失败，请检查相关文件', 'error');
                loginBtn.innerHTML = '<span>登录系统</span>';
                loginBtn.disabled = false;
                recordLoginLog(account, 'failed', 'API初始化失败');
                return;
            }

            api.userLogin(account, password).completed(function (data) {
                if (data.Status === 0) {
                    showStatus('登录成功，正在跳转...', 'success');
                    recordLoginLog(account, 'success');
                    
                    const configData = {
                        account: account,
                        password: password,
                        deviceID: deviceID,
                        coldChainDeviceID: coldChainDeviceID
                    };
                    sessionStorage.setItem('platformConfig', JSON.stringify(configData));

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showStatus(data.Msg || '登录失败，请检查账号密码', 'error');
                    loginBtn.innerHTML = '<span>登录系统</span>';
                    loginBtn.disabled = false;
                    recordLoginLog(account, 'failed', data.Msg || '登录失败');
                }
            }).failed(function(error) {
                showStatus('网络请求失败，请检查网络连接', 'error');
                loginBtn.innerHTML = '<span>登录系统</span>';
                loginBtn.disabled = false;
                recordLoginLog(account, 'failed', '网络请求失败');
            });
        }

        document.getElementById('loginForm').addEventListener('submit', handleLogin);
        createParticles();
    </script>
</body>
</html>
