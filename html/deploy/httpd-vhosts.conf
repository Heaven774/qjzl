# ============================================
# 辣椒智慧农业 - Apache HTTPD 虚拟主机配置
# ============================================

<VirtualHost *:80>
    ServerName localhost
    ServerAdmin webmaster@localhost

    DocumentRoot "/var/www/html"

    # Gzip 压缩
    <IfModule mod_deflate.c>
        SetOutputFilter DEFLATE
        AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript application/json image/svg+xml
    </IfModule>

    # ========== API 反向代理 ==========
    ProxyPass /api/ http://node:3000/api/
    ProxyPassReverse /api/ http://node:3000/api/

    # ========== MJPEG 直播流代理 ==========
    ProxyPass /mjpeg http://python-rtsp:8081/mjpeg
    ProxyPassReverse /mjpeg http://python-rtsp:8081/mjpeg
    ProxySet /mjpeg connectiontimeout=10 timeout=86400

    # ========== 摄像头快照 ==========
    ProxyPass /snapshot http://python-rtsp:8081/snapshot
    ProxyPassReverse /snapshot http://python-rtsp:8081/snapshot

    # ========== PTZ 云台控制 ==========
    ProxyPass /ptz/ http://python-rtsp:8081/ptz/
    ProxyPassReverse /ptz/ http://python-rtsp:8081/ptz/

    # ========== 区块链存证 API ==========
    ProxyPass /api/blockchain/ http://python-trace:5500/api/blockchain/
    ProxyPassReverse /api/blockchain/ http://python-trace:5500/api/blockchain/

    # ========== AI 建议 API ==========
    ProxyPass /ai/ http://python-ai:4000/ai/
    ProxyPassReverse /ai/ http://python-ai:4000/ai/

    # ========== 溯源查询页面 ==========
    ProxyPass /trace http://python-trace:5500/trace
    ProxyPassReverse /trace http://python-trace:5500/trace

    # ========== 二维码生成 ==========
    ProxyPass /qr http://python-trace:5500/qr
    ProxyPassReverse /qr http://python-trace:5500/qr

    # ========== 二维码生成（手机APP兼容）==========
    ProxyPass /get_qr http://python-trace:5500/get_qr
    ProxyPassReverse /get_qr http://python-trace:5500/get_qr

    # ========== 静态文件缓存 ==========
    <LocationMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$">
        ExpiresActive On
        ExpiresDefault "access plus 7 days"
        Header set Cache-Control "public, immutable"
    </LocationMatch>

    # ========== qjzl 子目录 SPA 路由支持 ==========
    <Location /qjzl/>
        RewriteEngine On
        RewriteBase /qjzl/
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /qjzl/index.html [L]
    </Location>

    ErrorLog "logs/qjzl-error.log"
    CustomLog "logs/qjzl-access.log" common
</VirtualHost>

